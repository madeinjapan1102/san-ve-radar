name: Archive multi-route fares

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multi-route-fare-archive
  cancel-in-progress: false

jobs:
  scan-next-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scan next 12 due route-dates
        run: |
          curl --fail --silent --show-error --max-time 540 \
            -X POST "https://san-ve-radar.onrender.com/archive/run" \
            -H "content-type: application/json" \
            --data '{"limit":12}'
